<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b3a"><title>DEBBY ACADEMY — Guidance Portal</title><style>
:root{--g:#176b3a;--d:#104b2a;--p:#edf7ef;--ink:#183124;--muted:#627368;--line:#dce9df}*{box-sizing:border-box}body{margin:0;background:#f3f7f3;color:var(--ink);font-family:Arial,sans-serif}header{background:var(--g);color:#fff;padding:16px}header .wrap{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}main{max-width:1050px;margin:22px auto;padding:0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin:14px 0}h1{color:var(--d);font-size:23px;margin:0 0 8px}h2{font-size:18px;color:var(--d)}.muted{color:var(--muted);line-height:1.5}label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #b9cbbd;border-radius:8px;font-size:15px}button{border:0;border-radius:8px;background:var(--g);color:#fff;font-weight:700;padding:11px 14px;margin:6px 4px 4px 0}button.alt{background:#e8f2ea;color:var(--d)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:var(--p)}.msg{padding:10px;background:var(--p);border-radius:8px;margin:10px 0;white-space:pre-wrap}.hidden{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div class="wrap"><div><b>DEBBY ACADEMY</b><div style="font-size:12px;margin-top:4px">NURSERY · PRIMARY · SECONDARY | Excellence in Christ</div></div><button id="signout" class="alt hidden">Sign out</button></div></header><main><section id="login" class="card"><h1>Guidance sign in</h1><p class="muted">Use the school email account activated by the administrator.</p><form id="loginform"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button>Sign in</button></form><div id="loginmsg" class="msg" aria-live="polite"></div></section><section id="portal" class="hidden"><div class="card"><h1>Guidance Dashboard</h1><div id="identity" class="muted"></div><div id="notice" class="msg hidden"></div></div><div class="card"><h2>Assigned students</h2><div class="grid"><label>Select student<select id="student"><option value="">Loading students…</option></select></label><label>Follow-up date<input id="date" type="date"></label></div><label>Private welfare / follow-up note</label><textarea id="note" rows="4" maxlength="3000" placeholder="Record only relevant school guidance information."></textarea><button id="save">Save follow-up</button></div><div class="card"><h2>My follow-up records</h2><button id="refresh" class="alt">Refresh</button><div class="tablewrap"><table><thead><tr><th>Date</th><th>Student</th><th>Follow-up</th><th>Status</th></tr></thead><tbody id="notes"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></div></section><script>

const SUPABASE_URL='https://tjanijrtknykskexawpc.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_x8pHV4exEwWrQJwWkbP4VQ_wz9GzKhl';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function loginMessage(t,isErr=false){$('loginmsg').textContent=t;$('loginmsg').classList.remove('hidden');$('loginmsg').style.background=isErr?'#fff0ef':'#edf7ef';$('loginmsg').style.color=isErr?'#922b25':'#183124';}
async function boot(){
  $('loginform').addEventListener('submit',async e=>{e.preventDefault();loginMessage('Signing in…');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){loginMessage(error.message,true);return;}await enterStaffPortal();});
  $('signout').onclick=async()=>{await sb.auth.signOut();$('portal').classList.add('hidden');$('login').classList.remove('hidden');$('signout').classList.add('hidden');$('password').value='';};
  const {data,error}=await sb.auth.getSession();if(error){loginMessage(error.message,true);return;}if(data.session)await enterStaffPortal();
}
async function enterStaffPortal(){
  $('login').classList.add('hidden');$('portal').classList.remove('hidden');$('signout').classList.remove('hidden');
  await loadPortal();
  const identityText=$('identity').textContent||'';
  if(identityText.toLowerCase().includes('permission denied')||identityText.toLowerCase().includes('not authorised')||identityText.toLowerCase().includes('not authorized')){await sb.auth.signOut();$('portal').classList.add('hidden');$('login').classList.remove('hidden');$('signout').classList.add('hidden');loginMessage(identityText,true);}
}
function note(t){$('notice').textContent=t;$('notice').classList.remove('hidden')}async function loadPortal(){const {data:who,error}=await sb.rpc('guidance_portal_identity_v1');if(error){note(error.message);return}$('identity').textContent=`Welcome, ${who.full_name} · ${who.employee_number}`;await loadStudents();await loadNotes()}async function loadStudents(){const {data,error}=await sb.rpc('guidance_list_students_v1');if(error){note(error.message);return}const rows=Array.isArray(data)?data:[];$('student').innerHTML='<option value="">Select assigned student</option>'+rows.map(s=>`<option value="${s.student_id}">${esc(s.registration_number)} · ${esc(s.student_name)} · ${esc(s.class_name)}</option>`).join('');if(!rows.length)note('No students are assigned. Ask the administrator to assign a class to your Guidance staff record.')}async function loadNotes(){const {data,error}=await sb.rpc('guidance_list_notes_v1');if(error){note(error.message);return}const rows=Array.isArray(data)?data:[];$('notes').innerHTML=rows.map(n=>`<tr><td>${new Date(n.created_at).toLocaleDateString()}</td><td>${esc(n.registration_number)}<br>${esc(n.student_name)}</td><td>${esc(n.note)}${n.follow_up_date?'<br><small>Follow-up: '+esc(n.follow_up_date)+'</small>':''}</td><td>${esc(n.follow_up_status)}</td></tr>`).join('')||'<tr><td colspan="4">No follow-up records yet.</td></tr>'}async function saveNote(){const sid=Number($('student').value),txt=$('note').value.trim();if(!sid||!txt){note('Select a student and enter a follow-up note.');return}const {data,error}=await sb.rpc('guidance_add_note_v1',{p_student_id:sid,p_note:txt,p_follow_up_date:$('date').value||null});if(error){note(error.message);return}note(data?.message||'Saved.');$('note').value='';$('date').value='';await loadNotes()}$('save').onclick=saveNote;$('refresh').onclick=loadNotes;boot();
</script></main></body></html>
